<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOODPICKER ITF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 1. Navbar อยู่ด้านบนสุด -->
  <nav class="navbar">
    <div class="logo">FOOD LAB 15</div>
  </nav>

  <!-- 2. ส่วนแสดงผลข้อมูลอาหาร -->
  <main class="container">
    <div class="card">
      <img id="food-img" src="https://images.unsplash.com/photo-1562967914-608f82629710?w=500" alt="รูปอาหาร">
      <h2 id="food-name">ข้าวมันไก่</h2>
      <p id="food-desc">ข้าวหุงน้ำซุปต้มไก่ ทานคู่กับไก่นุ่มและน้ำจิ้มเต้าเจี้ยวรสเด็ด</p>
      <div class="price-tag">ราคา <span id="food-price">50 - 60</span> บาท</div>
      
      <!-- 3. ปุ่มสุ่มเมนูอาหาร -->
      <button id="random-btn" onclick="randomFood()">🎲 สุ่มเมนูอาหาร</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
